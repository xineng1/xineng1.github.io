<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>花光首富的十个亿</title>
<meta name="theme-color" content="#ff8fb6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon.svg">
<style>
  html,body{margin:0;height:100%;background:linear-gradient(180deg,#ff8fb6 0%,#a98bff 100%);color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}
  .logo{font-size:27px;font-weight:800;letter-spacing:1px;text-shadow:0 2px 10px rgba(120,40,90,.25)}
  .logo span{display:block;font-size:13px;font-weight:600;opacity:.92;margin-top:8px}
  .tip{font-size:14px;opacity:.95;margin-top:20px}
  .btn{margin-top:22px;padding:13px 30px;border:none;border-radius:26px;background:#fff;color:#d6396e;
    font-size:16px;font-weight:800;box-shadow:0 8px 18px rgba(120,40,90,.25);cursor:pointer;display:none}
  .spin{margin-top:22px;width:28px;height:28px;border:3px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:r 1s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="logo">花光首富的十个亿<span>他不会破产</span></div>
  <div class="spin" id="spin"></div>
  <div class="tip" id="tip">正在进入败家现场…</div>
  <button class="btn" id="go" onclick="enter()">立即进入游戏</button>
  <script>
    var GAME='https://workbuddy.link/p/ZOth4HAZQ0Q33nix3Prm8o';
    function enter(){ location.replace(GAME); }
    setTimeout(function(){ if(document.hidden) return; enter(); }, 700);
    setTimeout(function(){ var b=document.getElementById('go'); if(b) b.style.display='inline-block';
      var s=document.getElementById('spin'); if(s) s.style.display='none';
      var t=document.getElementById('tip'); if(t) t.textContent='若未自动跳转，请点下方按钮'; }, 1400);
    if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('service-worker.js').catch(function(){}); }); }
  </script>
</body>
</html>
