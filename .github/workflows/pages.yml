name: Generate PWA Icons

# GitHub Pages 处于「分支模式」：站点直接服务 main 分支上的文件。
# 因此这里只负责在 runner 内生成真实 PNG 图标，并 git commit 回 main，
# 由 Pages 自动构建流程服务这些二进制文件（MCP 文本通道无法直传二进制）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --quiet Pillow

      - name: Generate PWA icons
        run: python gen_icons.py

      - name: Commit real PNGs back to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          LAST=$(git log -1 --pretty=%B)
          if echo "$LAST" | grep -qF "[bot-icons]"; then
            echo "already generated by bot, skip to avoid loop"
            exit 0
          fi
          git add icons/icon-192.png icons/icon-512.png icons/maskable-512.png
          if git diff --staged --quiet; then
            echo "icons unchanged"
          else
            git commit -m "[bot-icons] regenerate PWA icons (real PNG)"
            git push
          fi
